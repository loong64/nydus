name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false
        default: ''
  schedule:
    - cron: '0 20 * * *'

env:
  RUST_BACKTRACE: 1
  FEATURES: cli,uffd,fanotify,fileio,dragonfly

jobs:
  check:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      build: ${{ steps.check-build.outputs.build }}
    steps:
      - name: Check Version
        id: get-version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(curl -s 'https://api.github.com/repos/dragonflyoss/nydus/releases/latest' | jq -r ".tag_name")
          fi
          echo "Current Version: ${version}"
          if [ -z "${version}" ] || [ "${version}" == "null" ]; then
            echo "Failed to get version"
            exit 1
          fi
          echo "version=${version}" >> $GITHUB_ENV
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Check Build
        id: check-build
        run: |
          gh release view ${version} -R ${{ github.repository }} >/dev/null 2>&1 || echo "build=1" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: check
    if: needs.check.outputs.build == '1'
    env:
      RELEASE_TAG: ${{ needs.check.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - arch: loong64
            runner: ubuntu-24.04
            target: loongarch64-unknown-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: dragonflyoss/nydus
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: nydusify/go.mod
          cache-dependency-path: nydusify/go.sum

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev pkg-config perl make file

      - name: Install LoongArch64 cross toolchain
        if: matrix.arch == 'loong64'
        run: |
          sudo apt-get install -y qemu-user
          curl --fail --location --retry 3 \
            https://github.com/loong64/musl-cross-make/releases/download/20260507/loongarch64-linux-musl-cross.tgz \
            | tar xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/loongarch64-linux-musl-cross/bin" >> "${GITHUB_PATH}"

      - name: Build nydus
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CC_loongarch64_unknown_linux_musl: loongarch64-linux-musl-gcc
          CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_MUSL_LINKER: loongarch64-linux-musl-gcc
        run: |
          cargo build -p nydus --release \
            --target ${{ matrix.target }} \
            --features "${FEATURES}"

      - name: Build nydusify
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          cd nydusify
          go build -ldflags "-s -w" -o nydusify .

      - name: Package release tarball
        run: |
          mkdir nydus-static
          cp target/${{ matrix.target }}/release/nydus nydusify/nydusify config/registry.example.yaml nydus-static/
          for bin in nydus-static/nydus nydus-static/nydusify; do
            file "${bin}" | grep -Eq 'statically linked|static-pie linked'
            if [ "${{ matrix.arch }}" != "loong64" ]; then
              "./${bin}" --help > /dev/null
            fi
          done
          tarball="nydus-static-${RELEASE_TAG}-linux-${{ matrix.arch }}.tgz"
          tar cf - nydus-static | gzip > "${tarball}"
          sha256sum "${tarball}" > "${tarball}.sha256sum"
          echo "tarball=${tarball}" >> "${GITHUB_ENV}"

      - name: Upload release tarball
        uses: actions/upload-artifact@v6
        with:
          name: nydus-release-tarball-linux-${{ matrix.arch }}
          path: |
            ${{ env.tarball }}
            ${{ env.tarball }}.sha256sum
          if-no-files-found: error

  release:
    name: Release
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: needs.check.outputs.build == '1'
    env:
      RELEASE_TAG: ${{ needs.check.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Download release tarballs
        uses: actions/download-artifact@v7
        with:
          pattern: nydus-release-tarball-*
          merge-multiple: true
          path: nydus-tarball

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nydus ${{ env.RELEASE_TAG }}"
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: nydus-tarball/*
          fail_on_unmatched_files: true
